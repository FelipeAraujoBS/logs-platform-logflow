services:
  redis:
    image: redis:7-alpine
    container_name: logflow-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: logflow-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
      MONGO_INITDB_DATABASE: logflow
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5

  ingestor:
    build:
      context: .
      dockerfile: packages/ingestor/Dockerfile
    container_name: logflow-ingestor
    ports:
      - "3000:3000"
      - "50051:50051"
    environment:
      HTTP_PORT: 3000
      GRPC_PORT: 50051
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: packages/worker/Dockerfile
    container_name: logflow-worker
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MONGODB_URI: mongodb://admin:admin@mongodb:27017/logflow?authSource=admin
      MONGODB_DB: logflow
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  query-api:
    build:
      context: .
      dockerfile: packages/query-api/Dockerfile
    container_name: logflow-query-api
    ports:
      - "3001:3001"
    environment:
      HTTP_PORT: 3001
      MONGODB_URI: mongodb://admin:admin@mongodb:27017/logflow?authSource=admin
      MONGODB_DB: logflow
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: packages/dashboard/Dockerfile
    container_name: logflow-dashboard
    ports:
      - "80:80"
    depends_on:
      - query-api
    restart: unless-stopped

volumes:
  redis-data:
  mongo-data:
