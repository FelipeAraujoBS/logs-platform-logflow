syntax = "proto3";

package log;

service LogService {
  rpc IngestLog (LogRequest) returns (LogResponse);
}

message LogRequest {
  string severity           = 1;
  string service_name       = 2;
  string service_version    = 3;
  string service_environment = 4;
  string service_host       = 5;
  string message            = 6;
  int64  timestamp_ms       = 7;
  string trace_id           = 8;
  string span_id            = 9;
  string metadata_json      = 10;
}

message LogResponse {
  string id      = 1;
  bool   success = 2;
}